<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANG369 Galaxy Audio Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="player-container">
        <header class="player-header">
            <h2><i class="fa-solid fa-compact-disc spin"></i> RTVO MANG 369</h2>
        </header>

        <!-- Selector de Categoría -->
        <div class="category-selector">
            <label for="categorySelect">Categoría:</label>
            <select id="categorySelect" onchange="changeCategory()">
                <option value="AMOR">Amor</option>
                <option value="EL_PATRON">El Patrón</option>
                <option value="ARABE">Árabe</option>
                <option value="SALSA">Salsa</option>
                <option value="MEDICINA">Medicina</option>
                <option value="LLANERAS">Llaneras</option>
                <option value="GENERAL">General</option>
            </select>
        </div>

        <!-- Visualizador de Carátula Galáctico -->
        <div class="audio-visualizer" id="visualizer">
            <i class="fa-solid fa-radio music-icon"></i>
        </div>

        <!-- Contenedor del reproductor de YouTube (oculto de forma segura) -->
        <div id="hidden-player" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></div>

        <div class="now-playing">
            <h3 id="songTitle">Cargando reproductor...</h3>
            <p id="songArtist">Categoría: AMOR</p>
        </div>

        <!-- Controles principales -->
        <div class="controls">
            <button onclick="prevSong()" class="btn" title="Anterior"><i class="fa-solid fa-backward"></i></button>
            <button id="playBtn" onclick="togglePlay()" class="btn btn-main" title="Reproducir/Pausar"><i class="fa-solid fa-play"></i></button>
            <button onclick="nextSong()" class="btn" title="Siguiente"><i class="fa-solid fa-forward"></i></button>
        </div>

        <!-- Lista de reproducción -->
        <div class="playlist-container">
            <h4>Lista de Pistas</h4>
            <ul id="playlist"></ul>
        </div>
    </div>

    <!-- API de YouTube IFrame -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
